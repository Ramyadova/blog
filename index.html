<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: url("https://wallpapercave.com/wp/K95gIGw.jpg");
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .form-container {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
    }
    .form-group {
      margin-bottom: 15px;
    }
    form input,
    form textarea,
    form select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      transition: all 0.3s ease;
    }
    form textarea {
      rows: 2;
    }
    form input:focus,
    form textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }
    form button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    form button:hover {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      transform: translateY(-2px);
    }
    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
    .login-link a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .login-link a:hover {
      color: #6366f1;
      text-decoration: underline;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    @media (max-width: 600px) {
      .form-container {
        padding: 10px;
        max-width: 300px;
        margin: auto;
      }
      body {
        align-items: flex-start;
        padding-top: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <input type="text" name="name" placeholder="Full Name" required />
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Email Address" required />
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password" required />
      </div>
      <div class="form-group">
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
      </div>
      <div class="form-group">
        <input type="tel" name="mobile" placeholder="Mobile Number" pattern="[0-9]{10}" required />
      </div>
      <div class="form-group">
        <input type="date" name="dob" required />
      </div>
      <div class="form-group">
        <textarea name="address" placeholder="Your Address" rows="2" required></textarea>
      </div>
      <button type="submit">Register Now</button>
    </form>
    <div class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const password = this.password.value;
      const confirmPassword = this.confirmPassword.value;
      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }
      const userData = {
        name: this.name.value,
        email: this.email.value,
        password: password,
        mobile: this.mobile.value,
        dob: this.dob.value,
        address: this.address.value
      };
      localStorage.setItem("userData", JSON.stringify(userData));
      alert("Registration successful! Redirecting to login page...");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
